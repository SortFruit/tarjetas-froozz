<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directorio de tarjetas · Froozz Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --beige:#F6EFE4;
  --card:rgba(255,255,255,.6);
  --card-border:rgba(255,255,255,.8);
  --ink:#3B2417;
  --ink-dim:#8A7268;
  --line:#EAE0D2;
  --theme:#D6206F;
  --theme-2:#EA5A7E;
  --theme-soft:#F7DCE7;
  --peach:#FFB35C;
  --gold:#FDB913;
  --coral:#F15A45;
  --plum:#6B3358;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{ margin:0; min-height:100%; }
body{
  font-family:'Nunito', sans-serif;
  background:var(--beige);
  color:var(--ink);
  position:relative;
  overflow-x:hidden;
  display:flex; justify-content:center;
  padding:44px 18px 60px;
}
.bg-blobs{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.5; }
.b1{ width:260px; height:260px; background:var(--coral);  top:-70px;  left:-80px; }
.b2{ width:220px; height:220px; background:var(--gold);   top:30px;   right:-90px; }
.b3{ width:260px; height:260px; background:var(--theme);  bottom:-60px; left:10%; opacity:.35; }
.b4{ width:220px; height:220px; background:var(--plum);   bottom:-90px; right:-60px; }

.wrap{ position:relative; z-index:1; width:100%; max-width:480px; }

.head{ text-align:center; margin-bottom:22px; }
.head h1{
  font-family:'Fredoka', sans-serif; font-weight:600; font-size:24px; margin:0 0 4px;
}
.head p{ font-size:13px; color:var(--ink-dim); margin:0; }

.search-box{
  background:var(--card); border:1px solid var(--card-border);
  border-radius:18px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 16px 36px rgba(59,36,23,.12);
  padding:6px; margin-bottom:16px;
  display:flex; align-items:center; gap:8px;
}
.search-box svg{ flex-shrink:0; margin-left:10px; color:var(--ink-dim); width:18px; height:18px; }
.search-box input{
  flex:1; border:none; background:transparent; outline:none;
  font-family:'Nunito', sans-serif; font-size:15px; padding:12px 10px 12px 0;
  color:var(--ink);
}
.search-box input::placeholder{ color:var(--ink-dim); }

#count{ font-size:12px; color:var(--ink-dim); margin:0 4px 10px; }

.list{
  background:var(--card); border:1px solid var(--card-border);
  border-radius:18px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 16px 36px rgba(59,36,23,.12);
  overflow:hidden;
}
.row{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px;
  text-decoration:none; color:var(--ink);
  border-bottom:1px solid var(--line);
  transition:background .15s ease;
}
.row:last-child{ border-bottom:none; }
.row:active{ background:rgba(255,255,255,.6); }
.avatar{
  width:42px; height:42px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(150deg, var(--peach), var(--theme));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px;
}
.info{ flex:1; min-width:0; }
.info .name{ font-weight:700; font-size:14.5px; }
.info .role{ font-size:11.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.arrow{ color:var(--ink-dim); flex-shrink:0; }

#empty{ display:none; text-align:center; padding:30px 10px; color:var(--ink-dim); font-size:14px; }

footer{
  text-align:center; font-size:11px; color:var(--ink-dim);
  margin-top:20px; font-weight:700; opacity:.85;
}
</style>
</head>
<body>

<div class="bg-blobs">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
</div>

<div class="wrap">
  <div class="head">
    <h1>Directorio Froozz</h1>
    <p>Busca a la persona para abrir su tarjeta de contacto</p>
  </div>

  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Escribe un nombre..." autocomplete="off">
  </div>

  <p id="count"></p>

  <div class="list" id="list"></div>
  <div id="empty">No hay ninguna tarjeta con ese nombre.</div>

  <footer>Froozz Group, S.L. · itfruit.com</footer>
</div>

<script>
  var people = [
    {"name": "Arturo Herrera", "role": "IT Administrator", "slug": "Arturo-Herrera"},
    {"name": "Álvaro Blas", "role": "Orders & Logistics Manager", "slug": "Alvaro-Blas"},
    {"name": "Carlos Delgado", "role": "General Manager", "slug": "Carlos-Delgado"},
    {"name": "Carlos Ventura", "role": "Production Assistant", "slug": "Carlos-Ventura"},
    {"name": "Celia Peris", "role": "Quality Specialist", "slug": "Celia-Peris"},
    {"name": "Dani Tamarit", "role": "Key Account Manager — Portugal, España, UK", "slug": "Dani-Tamarit"},
    {"name": "Diana Hernández", "role": "Sales & Operations Planner", "slug": "Diana-Hernandez"},
    {"name": "Elia López", "role": "Accounts Receivable & Payable Specialist", "slug": "Elia-Lopez"},
    {"name": "Estefanía Aracil", "role": "Administrativa de Recepción y Logística", "slug": "Estefania-Aracil"},
    {"name": "Ferrán Martínez", "role": "Finance Assistant", "slug": "Ferran-Martinez"},
    {"name": "José Vicente Font", "role": "Chief Executive Officer", "slug": "Jose-Vicente-Font"},
    {"name": "Juan Carlos Vitar", "role": "Industrial Maintenance Manager", "slug": "Juan-Carlos-Vitar"},
    {"name": "Lucía Rodríguez", "role": "Marketing and Content Coordinator", "slug": "Lucia-Rodriguez"},
    {"name": "Mathilde Foucaud", "role": "Product Develop. & Client Manag. Specialist", "slug": "Mathilde-Foucaud"},
    {"name": "Pablo Muñoz", "role": "Key Account Manager — France", "slug": "Pablo-Munoz"},
    {"name": "Pablo Ruiz", "role": "Quality Assistant", "slug": "Pablo-Ruiz"},
    {"name": "Pepe Cots", "role": "Purchases & Logistics Coordinator", "slug": "Pepe-Cots"},
    {"name": "Raquel Lizandra", "role": "Finance & Accounting Analyst", "slug": "Raquel-Lizandra"},
    {"name": "Raúl Pérez", "role": "Technical Assistant", "slug": "Raul-Perez"},
    {"name": "Susana Carrasco", "role": "Head of Production & R&D", "slug": "Susana-Carrasco"},
    {"name": "Víctor Raga", "role": "Orders & Logistics Assistant", "slug": "Victor-Raga"}
  ];

  function normalize(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function initials(name) {
    var parts = name.split(' ');
    var first = parts[0] ? parts[0][0] : '';
    var last = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }

  function render(filter) {
    var listEl = document.getElementById('list');
    var emptyEl = document.getElementById('empty');
    var countEl = document.getElementById('count');
    var norm = normalize(filter || '');

    var matches = people.filter(function (p) {
      return normalize(p.name).indexOf(norm) !== -1 || normalize(p.role).indexOf(norm) !== -1;
    });

    listEl.innerHTML = matches.map(function (p) {
      return '<a class="row" href="/' + p.slug + '/">' +
        '<div class="avatar">' + initials(p.name) + '</div>' +
        '<div class="info"><div class="name">' + p.name + '</div><div class="role">' + p.role + '</div></div>' +
        '<svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
        '</a>';
    }).join('');

    listEl.style.display = matches.length ? 'block' : 'none';
    emptyEl.style.display = matches.length ? 'none' : 'block';
    countEl.textContent = matches.length + (matches.length === 1 ? ' persona' : ' personas');
  }

  document.getElementById('search').addEventListener('input', function (e) {
    render(e.target.value);
  });

  render('');
</script>
</body>
</html>
